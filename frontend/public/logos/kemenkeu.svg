<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="kemenkeuBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D62"/>
      <stop offset="100%" stop-color="#001433"/>
    </linearGradient>
    <linearGradient id="kemenkeuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F2A900"/>
      <stop offset="100%" stop-color="#A67300"/>
    </linearGradient>
  </defs>
  <!-- Segi Lima Berbingkai Emas -->
  <polygon points="100,10 188,72 154,182 46,182 12,72" fill="url(#kemenkeuBlue)" stroke="url(#kemenkeuGold)" stroke-width="4"/>
  <polygon points="100,18 178,74 148,174 52,174 22,74" fill="none" stroke="url(#kemenkeuGold)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Bintang Segi Lima Emas di Atas -->
  <polygon points="100,32 103,42 114,42 105,49 108,59 100,53 92,59 95,49 86,42 97,42" fill="url(#kemenkeuGold)"/>
  <!-- Sayap Sayap Emas Nagabanda -->
  <g fill="url(#kemenkeuGold)">
    <!-- Sayap Kiri -->
    <path d="M100,88 C70,78 45,68 32,50 C44,68 64,88 95,98 Z"/>
    <path d="M100,98 C72,92 50,84 36,68 C46,84 66,100 95,108 Z"/>
    <path d="M100,108 C75,104 56,98 44,85 C52,98 70,112 95,118 Z"/>
    <!-- Sayap Kanan -->
    <path d="M100,88 C130,78 155,68 168,50 C156,68 136,88 105,98 Z"/>
    <path d="M100,98 C128,92 150,84 164,68 C154,84 134,100 105,108 Z"/>
    <path d="M100,108 C125,104 144,98 156,85 C148,98 130,112 105,118 Z"/>
  </g>
  <!-- Timbangan Keadilan (Dacing Emas) -->
  <g stroke="url(#kemenkeuGold)" stroke-width="2" fill="none">
    <line x1="100" y1="72" x2="100" y2="135"/>
    <line x1="72" y1="84" x2="128" y2="84"/>
    <!-- Piringan Kiri -->
    <line x1="72" y1="84" x2="62" y2="106"/>
    <line x1="72" y1="84" x2="82" y2="106"/>
    <path d="M60,106 Q72,114 84,106 Z" fill="url(#kemenkeuGold)"/>
    <!-- Piringan Kanan -->
    <line x1="128" y1="84" x2="118" y2="106"/>
    <line x1="128" y1="84" x2="138" y2="106"/>
    <path d="M116,106 Q128,114 140,106 Z" fill="url(#kemenkeuGold)"/>
  </g>
  <!-- Lingkaran Padi & Kapas Bawah -->
  <path d="M70,140 Q100,165 130,140" fill="none" stroke="url(#kemenkeuGold)" stroke-width="3"/>
  <rect x="68" y="152" width="64" height="15" rx="3" fill="#FFE066"/>
  <text x="100" y="163" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="8" fill="#002D62">KEMENKEU</text>
</svg>