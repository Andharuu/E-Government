<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgKes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#bgKes)" stroke="#059669" stroke-width="4"/>
  <!-- Spiral Bunga Hijau & Biru Khas BPJS Kesehatan -->
  <g transform="translate(100, 88)">
    <!-- Daun Hijau 1 -->
    <path d="M0,0 C-15,-35 -5,-65 20,-60 C38,-55 35,-25 0,0 Z" fill="#059669"/>
    <!-- Daun Biru 2 -->
    <path d="M0,0 C35,-15 65,-5 60,20 C55,38 25,35 0,0 Z" fill="#0284C7"/>
    <!-- Daun Hijau Muda 3 -->
    <path d="M0,0 C15,35 5,65 -20,60 C-38,55 -35,25 0,0 Z" fill="#10B981"/>
    <!-- Daun Biru Tua 4 -->
    <path d="M0,0 C-35,15 -65,5 -60,-20 C-55,-38 -25,-35 0,0 Z" fill="#0369A1"/>
    <!-- Titik Putih Pusat -->
    <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
  </g>
  <!-- Text Label -->
  <text x="100" y="162" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" fill="#065F46" letter-spacing="0.5">BPJS Kesehatan</text>
</svg>