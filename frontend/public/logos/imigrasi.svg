<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="imigrasiBg" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#00695C"/>
      <stop offset="100%" stop-color="#00332C"/>
    </radialGradient>
    <linearGradient id="goldImigrasi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#C67C00"/>
    </linearGradient>
  </defs>
  <!-- Lingkaran Luar Hijau Tua Imigrasi -->
  <circle cx="100" cy="100" r="92" fill="url(#imigrasiBg)" stroke="url(#goldImigrasi)" stroke-width="5"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#goldImigrasi)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Garis Meridian Bumi / Globe Lat-Long -->
  <g fill="none" stroke="#80CBC4" stroke-width="1" opacity="0.6">
    <circle cx="100" cy="100" r="56"/>
    <ellipse cx="100" cy="100" rx="32" ry="56"/>
    <line x1="44" y1="100" x2="156" y2="100"/>
    <line x1="52" y1="78" x2="148" y2="78"/>
    <line x1="52" y1="122" x2="148" y2="122"/>
  </g>
  <!-- Lambang Garuda Menghadap Kanan (Kepala & Sayap Imigrasi) -->
  <g fill="url(#goldImigrasi)">
    <!-- Bintang di Atas -->
    <polygon points="100,26 103,34 112,34 105,39 107,47 100,42 93,47 95,39 88,34 97,34"/>
    <!-- Kepala Garuda Profil -->
    <path d="M96,55 C108,54 118,62 124,72 C114,75 110,80 112,85 C106,82 102,80 96,82 C98,74 95,65 96,55 Z"/>
    <polygon points="124,72 136,75 122,78"/>
    <!-- Sayap Pelindung Gerbang Negara -->
    <path d="M100,105 C70,95 48,80 34,60 C46,80 68,105 100,118 Z"/>
    <path d="M100,118 C72,112 54,102 42,85 C52,102 72,120 100,128 Z"/>
    <path d="M100,105 C130,95 152,80 166,60 C154,80 132,105 100,118 Z"/>
    <path d="M100,118 C128,112 146,102 158,85 C148,102 128,120 100,128 Z"/>
  </g>
  <!-- Pita Tulisan IMIGRASI -->
  <rect x="52" y="148" width="96" height="22" rx="5" fill="#00332C" stroke="url(#goldImigrasi)" stroke-width="2"/>
  <text x="100" y="163" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#FFE082" letter-spacing="1.5">IMIGRASI</text>
</svg>