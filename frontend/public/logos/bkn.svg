<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bknBg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#8B0015"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F5B000"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="100" cy="100" r="89" fill="url(#bknBg)"/>
  <!-- Laurel Wreath (Padi & Kapas Ring) -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Golden Bintang Lima di Atas -->
  <polygon points="100,28 104,40 117,40 107,48 111,60 100,53 89,60 93,48 83,40 96,40" fill="url(#gold)"/>
  <!-- Sayap Garuda Emas Lambang BKN -->
  <g fill="url(#gold)">
    <!-- Sayap Kiri -->
    <path d="M100,95 C75,85 52,72 32,52 C45,72 65,95 95,108 Z"/>
    <path d="M100,108 C75,100 56,90 38,72 C50,90 70,110 95,120 Z"/>
    <path d="M100,120 C78,115 62,108 48,92 C58,108 76,124 95,130 Z"/>
    <!-- Sayap Kanan -->
    <path d="M100,95 C125,85 148,72 168,52 C155,72 135,95 105,108 Z"/>
    <path d="M100,108 C125,100 144,90 162,72 C150,90 130,110 105,120 Z"/>
    <path d="M100,120 C122,115 138,108 152,92 C142,108 124,124 105,130 Z"/>
    <!-- Perisai Tengah -->
    <path d="M88,85 L112,85 L112,112 C112,126 100,136 100,136 C100,136 88,126 88,112 Z" fill="#001D39" stroke="url(#gold)" stroke-width="2"/>
    <!-- Bintang dalam perisai -->
    <polygon points="100,94 102,100 108,100 103,104 105,110 100,107 95,110 97,104 92,100 98,100" fill="url(#gold)"/>
    <!-- Ekor Bawah BKN -->
    <path d="M92,136 L100,165 L108,136 Z"/>
    <path d="M84,134 L92,160 L96,135 Z"/>
    <path d="M116,134 L108,160 L104,135 Z"/>
  </g>
  <!-- Text Pita BKN -->
  <rect x="65" y="166" width="70" height="18" rx="4" fill="#001D39" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="100" y="179" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" letter-spacing="1.5">B K N</text>
</svg>