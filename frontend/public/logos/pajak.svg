<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="djpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="djpNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D62"/>
      <stop offset="100%" stop-color="#001433"/>
    </linearGradient>
  </defs>
  <!-- Card Background White / Subtle Border -->
  <rect width="200" height="200" rx="36" fill="#002D62" stroke="url(#djpGold)" stroke-width="4"/>
  <!-- Simbol Sayap & Surya DJP (Burung Surya / Sayap Kuning Khas Ditjen Pajak) -->
  <g transform="translate(100, 85)">
    <!-- Sayap Kuning Emas Kiri -->
    <path d="M-6,18 C-35,15 -68,-10 -60,-50 C-45,-45 -25,-25 -10,-8 Z" fill="url(#djpGold)"/>
    <path d="M-6,28 C-30,28 -55,8 -52,-25 C-40,-20 -22,-5 -8,8 Z" fill="url(#djpGold)"/>
    <path d="M-6,38 C-25,38 -45,25 -42,0 C-32,5 -18,18 -6,22 Z" fill="url(#djpGold)"/>
    <!-- Sayap Kuning Emas Kanan -->
    <path d="M6,18 C35,15 68,-10 60,-50 C45,-45 25,-25 10,-8 Z" fill="url(#djpGold)"/>
    <path d="M6,28 C30,28 55,8 52,-25 C40,-20 22,-5 8,8 Z" fill="url(#djpGold)"/>
    <path d="M6,38 C25,38 45,25 42,0 C32,5 18,18 6,22 Z" fill="url(#djpGold)"/>
    <!-- Badan & Kepala Burung Surya / Perisai Tengah -->
    <path d="M-8,-42 C-8,-52 0,-58 0,-58 C0,-58 8,-52 8,-42 C8,-25 15,25 0,45 C-15,25 -8,-25 -8,-42 Z" fill="#FFFFFF"/>
    <!-- Inti Surya Kuning -->
    <circle cx="0" cy="-20" r="10" fill="url(#djpGold)"/>
  </g>
  <!-- Banner & Teks DJP PAJAK -->
  <rect x="52" y="146" width="96" height="24" rx="6" fill="url(#djpGold)"/>
  <text x="100" y="163" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#002D62" letter-spacing="2">D J P</text>
</svg>