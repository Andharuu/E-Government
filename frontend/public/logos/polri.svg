<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <!-- Perisai Luar Emas & Hitam POLRI -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Bintang Tiga di Atas (Tribrata) -->
  <g fill="url(#goldGrad)">
    <!-- Bintang Tengah -->
    <path d="M 100,12 L 103,22 L 113,22 L 105,28 L 108,38 L 100,32 L 92,38 L 95,28 L 87,22 L 97,22 Z" />
    <!-- Bintang Kiri -->
    <path d="M 68,20 L 70.5,28 L 79,28 L 72,33 L 74.5,41 L 68,36 L 61.5,41 L 64,33 L 57,28 L 65.5,28 Z" />
    <!-- Bintang Kanan -->
    <path d="M 132,20 L 134.5,28 L 143,28 L 136,33 L 138.5,41 L 132,36 L 125.5,41 L 128,33 L 121,28 L 129.5,28 Z" />
  </g>

  <!-- Outline Perisai Emas -->
  <path d="M 100,48 Q 160,48 165,100 Q 170,165 100,205 Q 30,165 35,100 Q 40,48 100,48 Z" 
        fill="url(#goldGrad)" />

  <!-- Badan Perisai Hitam -->
  <path d="M 100,54 Q 154,54 158,102 Q 163,160 100,198 Q 37,160 42,102 Q 46,54 100,54 Z" 
        fill="url(#shieldGrad)" />

  <!-- Lambang Kepala Rajawali & Obor Polri -->
  <!-- Obor Api -->
  <path d="M 100,72 Q 106,85 100,94 Q 94,85 100,72 Z" fill="#EF4444" />
  <path d="M 100,78 Q 103,86 100,92 Q 97,86 100,78 Z" fill="#FBBF24" />
  <!-- Tiang Obor -->
  <rect x="98" y="94" width="4" height="24" rx="2" fill="url(#goldGrad)" />

  <!-- Sayap Kiri dan Kanan -->
  <g fill="url(#goldGrad)">
    <!-- Sayap Kiri -->
    <path d="M 94,95 C 75,90 60,105 56,120 C 65,116 75,118 94,115 Z" />
    <path d="M 94,105 C 78,104 65,118 62,130 C 72,126 80,126 94,122 Z" />
    <path d="M 94,115 C 82,116 72,126 70,138 C 78,134 84,133 94,128 Z" />

    <!-- Sayap Kanan -->
    <path d="M 106,95 C 125,90 140,105 144,120 C 135,116 125,118 106,115 Z" />
    <path d="M 106,105 C 122,104 135,118 138,130 C 128,126 120,126 106,122 Z" />
    <path d="M 106,115 C 118,116 128,126 130,138 C 122,134 116,133 106,128 Z" />
  </g>

  <!-- Pita Emas Bawah "POLRI" -->
  <path d="M 52,162 Q 100,154 148,162 L 144,178 Q 100,170 56,178 Z" fill="url(#goldGrad)" />
  <text x="100" y="173" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#0F172A" text-anchor="middle" letter-spacing="2">POLRI</text>
</svg>
