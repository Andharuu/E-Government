<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="polriGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#B28900"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#330000"/>
    </linearGradient>
  </defs>
  <!-- Outer Glow / Radiance Bulat -->
  <circle cx="100" cy="100" r="92" fill="#0A192F" stroke="url(#polriGold)" stroke-width="4"/>
  <!-- Pancaran Berkas Sinar (Bintang Sudut Delapan) -->
  <g stroke="url(#polriGold)" stroke-width="1.5" opacity="0.4">
    <line x1="100" y1="12" x2="100" y2="188"/>
    <line x1="12" y1="100" x2="188" y2="100"/>
    <line x1="38" y1="38" x2="162" y2="162"/>
    <line x1="38" y1="162" x2="162" y2="38"/>
  </g>
  <!-- Bintang Tiga Polri (Tri Brata) -->
  <g fill="url(#polriGold)">
    <polygon points="100,24 102,30 108,30 103,34 105,40 100,36 95,40 97,34 92,30 98,30"/>
    <polygon points="80,32 82,37 87,37 83,40 85,45 80,42 76,45 78,40 74,37 79,37"/>
    <polygon points="120,32 122,37 127,37 123,40 125,45 120,42 116,45 118,40 114,37 119,37"/>
  </g>
  <!-- Perisai Merah-Hitam -->
  <path d="M60,52 L140,52 C140,52 145,115 100,150 C55,115 60,52 60,52 Z" fill="url(#shieldBg)" stroke="url(#polriGold)" stroke-width="3"/>
  <!-- Tiang / Monumen Gada Keemasan -->
  <g fill="url(#polriGold)">
    <rect x="97" y="60" width="6" height="75" rx="1"/>
    <!-- Kepala Tiang -->
    <polygon points="100,54 106,62 94,62"/>
    <!-- Pangkal Tiang -->
    <rect x="93" y="132" width="14" height="4" rx="1"/>
  </g>
  <!-- Daun Padi dan Kapas Emas Melingkari Perisai -->
  <g fill="none" stroke="url(#polriGold)" stroke-width="2.5">
    <path d="M64,136 C45,110 45,70 66,54"/>
    <path d="M136,136 C155,110 155,70 134,54"/>
  </g>
  <!-- Pita Tulisan Rastra Sewakottama -->
  <path d="M48,155 C75,148 125,148 152,155 L146,168 C125,162 75,162 54,168 Z" fill="#8B0000" stroke="url(#polriGold)" stroke-width="1.5"/>
  <text x="100" y="163" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="7.5" fill="#FFE57F" letter-spacing="1">POLRI</text>
</svg>