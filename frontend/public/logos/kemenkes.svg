<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="kesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#028090"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="#FFFFFF" stroke="#00A896" stroke-width="4"/>
  <!-- Tiga Lengkungan Dinamis Kemenkes Baru (Bentuk Hati & Senyum Sehat) -->
  <g transform="translate(100, 85)">
    <!-- Lengkung Atas Kiri -->
    <path d="M-45,-20 C-45,-55 -5,-55 0,-25 C5,-55 45,-55 45,-20 C45,20 0,55 0,55 C0,55 -45,20 -45,-20 Z" fill="none" stroke="url(#kesGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Simbol Palang Sehat Hijau di Dalam -->
    <rect x="-6" y="-30" width="12" height="34" rx="4" fill="#F4A261"/>
    <rect x="-17" y="-19" width="34" height="12" rx="4" fill="#F4A261"/>
  </g>
  <text x="100" y="165" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" fill="#028090" letter-spacing="1">KEMENKES</text>
</svg>