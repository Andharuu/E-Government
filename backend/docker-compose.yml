services:
  db:
    image: mysql:8.0
    container_name: govconnect_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: govconnect_db
      MYSQL_USER: govuser
      MYSQL_PASSWORD: govpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: