<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>GovConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="fontawesome/css/all.min.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="popup">

  <!-- App Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">
        <img src="logo-white.png" alt="GovConnect" style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      <div>
        <div class="brand-title">GovConnect</div>
        <div class="brand-sub">Asisten Formulir</div>
      </div>
    </div>
    <div class="sync-badge" id="syncStatusBadge">
      <span class="sync-dot"></span>
      <span id="syncStatusText">Tersinkron</span>
    </div>
  </header>

  <!-- ================= LOADING SCREEN ================= -->
  <main id="loadingScreen" class="screen active">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 240px; gap: 14px;">
      <div class="simple-spinner"></div>
      <span style="font-size: 12px; color: var(--text-muted); font-weight: 500;">Memuat data profil...</span>
    </div>
  </main>

  <!-- ================= AUTH SCREEN ================= -->
  <main id="authScreen" class="screen">
    <div class="auth-card">
      <h2 class="auth-heading" id="authTitle">Masuk ke GovConnect</h2>

      <div class="field">
        <label for="inputEmail">Email</label>
        <input type="email" id="inputEmail" placeholder="nama@email.com" autocomplete="username">
      </div>

      <div class="field">
        <label for="inputPassword">Password</label>
        <input type="password" id="inputPassword" placeholder="••••••••" autocomplete="current-password">
      </div>

      <div class="field" id="confirmField" style="display: none;">
        <label for="inputConfirm">Konfirmasi Password</label>
        <input type="password" id="inputConfirm" placeholder="••••••••" autocomplete="new-password">
      </div>

      <div id="authError" class="alert-box alert-error"></div>

      <button class="btn-primary" id="btnSubmitAuth">Masuk</button>

      <div class="auth-toggle">
        <span id="toggleText">Belum punya akun?</span>
        <button type="button" class="auth-toggle-btn" id="btnToggleMode">Daftar Akun</button>
      </div>
    </div>
  </main>

  <!-- ================= MAIN SCREEN ================= -->
  <main id="mainScreen" class="screen">
    <!-- Active Profile Card -->
    <div class="profile-card">
      <div class="profile-top">
        <div class="avatar-circle" id="userAvatar">U</div>
        <div class="profile-info">
          <div class="profile-name" id="profName">Memuat...</div>
          <div class="profile-email" id="userEmail">-</div>
        </div>
      </div>

      <div class="profile-data-list">
        <div class="data-row">
          <span class="data-label">NIK</span>
          <span class="data-val" id="profNik">-</span>
        </div>
        <div class="data-row">
          <span class="data-label">Nomor Telepon</span>
          <span class="data-val" id="profPhone">-</span>
        </div>
      </div>
    </div>

    <!-- Completion Meter -->
    <div class="meter-section">
      <div class="meter-header">
        <span class="meter-title">Kelengkapan Profil</span>
        <span class="meter-pct" id="completionPct">0%</span>
      </div>
      <div class="meter-track">
        <div class="meter-fill" id="progressFill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions-grid">
      <button class="btn-sidepanel" id="btnPopupQuickFill">
        <i class="fa-solid fa-bolt" style="font-size: 13px;"></i>
        <span>Buka Asisten Formulir (Melayang)</span>
      </button>

      <div class="secondary-row">
        <button class="btn-outline" id="btnDashboard">
          <i class="fa-solid fa-chart-pie" style="font-size: 11px;"></i>
          <span>Dashboard</span>
        </button>
        <button class="btn-outline btn-logout" id="btnLogout">
          <i class="fa-solid fa-arrow-right-from-bracket" style="font-size: 11px;"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
